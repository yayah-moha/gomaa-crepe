<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كريب جمعة – منيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1114;--card:#3a1a1e;--ink:#f6ead6;--mute:#c9b39a;--gold:#f0b132;--line:#6a3a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f8efe0;--card:#fff8ea;--ink:#2e1a14;--mute:#7b6352;--gold:#a8610a;--line:#e0cfb4}}
:root[data-theme="light"]{--bg:#f8efe0;--card:#fff8ea;--ink:#2e1a14;--mute:#7b6352;--gold:#a8610a;--line:#e0cfb4}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
header{text-align:center;padding:22px 16px 8px}.logo{display:block;width:230px;max-width:70%;height:auto;margin:0 auto}
.sub{color:var(--gold);margin:0;font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs button{flex:none;font:600 15px Cairo,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#2a1114}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#q{width:100%;font:400 16px Cairo,sans-serif;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}section{margin-top:26px}
h2{font:600 26px 'Reem Kufi',Cairo,sans-serif;color:var(--gold);margin:0 0 8px;display:inline-block;border-bottom:3px solid var(--gold)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px 24px 16px 22px;padding:6px 14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:300px}th{font-weight:600;color:var(--mute);font-size:13px;text-align:center;padding:6px 4px}
th:first-child,td:first-child{text-align:right}td{padding:8px 4px;border-top:1px dashed var(--line);text-align:center;font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}td:not(:first-child){color:var(--gold);font-weight:800}tr:first-child td{border-top:0}
.d{display:block;font-weight:400;color:var(--mute);font-size:12.5px;line-height:1.4}.hide{display:none}
#none{text-align:center;color:var(--mute);margin-top:30px}.note{color:var(--mute);font-size:13px;margin:8px 0 0}
footer{border-top:1px solid var(--line);text-align:center;padding:24px 14px calc(30px + env(safe-area-inset-bottom,0px))}
footer h3{color:var(--gold);margin:0 0 8px;font:600 24px 'Reem Kufi',Cairo,sans-serif}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:10px auto}
.ph a{background:var(--gold);color:#2a1114;text-decoration:none;font-weight:800;border-radius:10px;padding:8px;direction:ltr}
footer p{margin:6px 0;color:var(--mute)}
</style></head><body>
